# Postgres only — for local `dotnet run` (Web / Workers on the host).
# Usage:  docker compose -f docker-compose.db.yml up -d
# Full stack: docker compose up --build

name: kyc-db

services:
  kyc-postgres:
    image: postgres:17
    container_name: kyc-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-kyc_dev}
    volumes:
      - kyc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kyc_dev}"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  kyc_pgdata:
