[project]
name = "kyc-ai-platform"
version = "0.0.1b1"
description = "Thin client helpers for the KYC AI Platform (health + HTTP API base URL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
urls = { Homepage = "https://github.com/vitorcastro78/KYC", Repository = "https://github.com/vitorcastro78/KYC" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kyc_ai_platform*"]
