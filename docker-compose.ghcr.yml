# Run KYC from published GHCR images (no local build).
# Usage:
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Images (publish on push to main when CI is configured):
#   ghcr.io/vitorcastro78/kyc:latest
#   ghcr.io/vitorcastro78/kyc-workers:latest

name: kyc

services:
  kyc-postgres:
    image: pgvector/pgvector:pg17
    container_name: kyc-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-kyc_dev}
    volumes:
      - kyc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyc} -d ${POSTGRES_DB:-kyc_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kyc-net

  kyc-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kyc-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kyc}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME}
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - kyc-net

  kyc-web:
    image: ghcr.io/vitorcastro78/kyc:${KYC_TAG:-latest}
    container_name: kyc-web
    restart: unless-stopped
    depends_on:
      kyc-postgres:
        condition: service_healthy
      kyc-rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      KYC_DB_CONNECTION: Host=kyc-postgres;Port=5432;Database=${POSTGRES_DB:-kyc_dev};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-CHANGE_ME}
      ConnectionStrings__KycDatabase: Host=kyc-postgres;Port=5432;Database=${POSTGRES_DB:-kyc_dev};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-CHANGE_ME}
      KYC_RABBITMQ_CONNECTION: amqp://${RABBITMQ_USER:-kyc}:${RABBITMQ_PASSWORD:-CHANGE_ME}@kyc-rabbitmq:5672/
      Messaging__Provider: RabbitMq
      LLM__Mode: LocalOnly
      LLM__LocalEndpoint: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      LLM__LocalModel: ${DEFAULT_LLM_MODEL:-qwen3.5:9b}
      LLM__UseOllamaForScoring: "true"
      LLM__EnrichReportsWithLlm: "true"
      Auth__AdminEmail: ${KYC_ADMIN_EMAIL:-admin@kyc.local}
      Auth__AdminPassword: ${KYC_ADMIN_PASSWORD:-ChangeMe@1234}
      ExternalSources__OpenSanctions__ApiKey: ${OPENSANCTIONS_API_KEY:-}
      NewsApi__ApiKey: ${NEWSAPI_KEY:-}
    ports:
      - "${KYC_WEB_PORT:-8080}:8080"
    volumes:
      - kyc_documents:/app/Data/cases
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kyc-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  kyc-workers:
    image: ghcr.io/vitorcastro78/kyc-workers:${KYC_TAG:-latest}
    container_name: kyc-workers
    restart: unless-stopped
    depends_on:
      kyc-postgres:
        condition: service_healthy
      kyc-rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      KYC_DB_CONNECTION: Host=kyc-postgres;Port=5432;Database=${POSTGRES_DB:-kyc_dev};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-CHANGE_ME}
      ConnectionStrings__KycDatabase: Host=kyc-postgres;Port=5432;Database=${POSTGRES_DB:-kyc_dev};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-CHANGE_ME}
      KYC_RABBITMQ_CONNECTION: amqp://${RABBITMQ_USER:-kyc}:${RABBITMQ_PASSWORD:-CHANGE_ME}@kyc-rabbitmq:5672/
      Messaging__Provider: RabbitMq
      LLM__Mode: LocalOnly
      LLM__LocalEndpoint: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      LLM__LocalModel: ${DEFAULT_LLM_MODEL:-qwen3.5:9b}
      LLM__UseOllamaForScoring: "true"
      LLM__EnrichReportsWithLlm: "true"
      ExternalSources__OpenSanctions__ApiKey: ${OPENSANCTIONS_API_KEY:-}
      NewsApi__ApiKey: ${NEWSAPI_KEY:-}
    volumes:
      - kyc_worker_data:/app/Data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kyc-net

volumes:
  kyc_pgdata:
  kyc_documents:
  kyc_worker_data:

networks:
  kyc-net:
    driver: bridge
