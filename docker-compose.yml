# KYC on network-local — expects shared Postgres (network-postgres) + ContextMemory gateway.
# Usage:  cp .env.example .env && docker compose up --build
# Standalone Postgres for `dotnet run`: docker compose -f docker-compose.db.yml up -d

name: kyc

services:
  kyc-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: network-kyc-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kyc}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME}
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - network-local

  kyc-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: ${KYC_WEB_IMAGE:-kyc-web:local}
    container_name: network-kyc-web
    restart: unless-stopped
    depends_on:
      kyc-rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      KYC_DB_CONNECTION: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-kyc};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-kyc_dev}
      ConnectionStrings__KycDatabase: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-kyc};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-kyc_dev}
      KYC_RABBITMQ_CONNECTION: amqp://${RABBITMQ_USER:-kyc}:${RABBITMQ_PASSWORD:-CHANGE_ME}@kyc-rabbitmq:5672/
      Messaging__Provider: RabbitMq
      LLM__Mode: LocalOnly
      LLM__LocalEndpoint: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      LLM__LocalModel: ${DEFAULT_LLM_MODEL:-qwen3.5:9b}
      LLM__UseOllamaForScoring: "true"
      LLM__EnrichReportsWithLlm: "true"
      ContextMemory__BaseUrl: ${CONTEXT_MEMORY_BASE_URL:-https://context.kortexio.io}
      ContextMemory__AppId: ${CONTEXT_MEMORY_APP_ID:-kyc}
      ContextMemory__ApiKey: ${CONTEXT_MEMORY_API_KEY:-cm_kyc_local_key}
      ContextMemory__UserId: ${CONTEXT_MEMORY_USER_ID:-kyc-jobs}
      Auth__AdminEmail: ${KYC_ADMIN_EMAIL:-admin@kyc.local}
      Auth__AdminPassword: ${KYC_ADMIN_PASSWORD:-ChangeMe@1234}
      OpenSanctions__ApiKey: ${OPENSANCTIONS_API_KEY:-}
      ExternalSources__OpenSanctions__ApiKey: ${OPENSANCTIONS_API_KEY:-}
      NewsApi__ApiKey: ${NEWSAPI_KEY:-}
    ports:
      - "${KYC_WEB_PORT:-8083}:8080"
    volumes:
      - kyc_documents:/app/Data/cases
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - network-local

  kyc-workers:
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
    image: ${KYC_WORKERS_IMAGE:-kyc-workers:local}
    container_name: network-kyc-workers
    restart: unless-stopped
    depends_on:
      kyc-rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      KYC_DB_CONNECTION: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-kyc};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-kyc_dev}
      ConnectionStrings__KycDatabase: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-kyc};Username=${POSTGRES_USER:-kyc};Password=${POSTGRES_PASSWORD:-kyc_dev}
      KYC_RABBITMQ_CONNECTION: amqp://${RABBITMQ_USER:-kyc}:${RABBITMQ_PASSWORD:-CHANGE_ME}@kyc-rabbitmq:5672/
      Messaging__Provider: RabbitMq
      LLM__Mode: LocalOnly
      LLM__LocalEndpoint: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      LLM__LocalModel: ${DEFAULT_LLM_MODEL:-qwen3.5:9b}
      LLM__UseOllamaForScoring: "true"
      LLM__EnrichReportsWithLlm: "true"
      ContextMemory__BaseUrl: ${CONTEXT_MEMORY_BASE_URL:-https://context.kortexio.io}
      ContextMemory__AppId: ${CONTEXT_MEMORY_APP_ID:-kyc}
      ContextMemory__ApiKey: ${CONTEXT_MEMORY_API_KEY:-cm_kyc_local_key}
      ContextMemory__UserId: ${CONTEXT_MEMORY_USER_ID:-kyc-jobs}
      ExternalSources__OpenSanctions__ApiKey: ${OPENSANCTIONS_API_KEY:-}
      NewsApi__ApiKey: ${NEWSAPI_KEY:-}
    volumes:
      - kyc_worker_data:/app/Data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - network-local

volumes:
  kyc_documents:
  kyc_worker_data:

networks:
  network-local:
    external: true
