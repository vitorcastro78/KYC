name: Deploy local

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-local-kyc
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, network-local]
    timeout-minutes: 45
    steps:
      - name: Ensure Docker daemon is running
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\Program Files\Docker\Docker\resources\bin;C:\Program Files\Git\cmd;" + $env:Path

          function Test-DockerReady {
            $prev = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            docker info 1>$null 2>$null
            $ok = ($LASTEXITCODE -eq 0)
            $ErrorActionPreference = $prev
            return $ok
          }

          Write-Host "docker.exe: $((Get-Command docker -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source))"
          Get-Service -Name "*docker*" -ErrorAction SilentlyContinue | Format-Table Name, Status -AutoSize | Out-String | Write-Host

          if (Test-DockerReady) {
            Write-Host "Docker already running"
            exit 0
          }

          Write-Host "Docker daemon not ready - attempting start..."
          foreach ($svc in @("com.docker.service", "docker")) {
            if (Get-Service -Name $svc -ErrorAction SilentlyContinue) {
              Start-Service $svc -ErrorAction SilentlyContinue
            }
          }

          $desktopCandidates = @(
            "C:\Program Files\Docker\Docker\Docker Desktop.exe",
            "${env:ProgramFiles(x86)}\Docker\Docker\Docker Desktop.exe",
            "$env:LOCALAPPDATA\Docker\Docker Desktop.exe"
          )
          $started = $false
          foreach ($exe in $desktopCandidates) {
            if (Test-Path $exe) {
              Write-Host "Starting: $exe"
              Start-Process $exe
              $started = $true
              break
            }
          }
          if (-not $started) {
            Write-Host "Docker Desktop.exe not found in common paths."
            Get-ChildItem "C:\Program Files\Docker" -Recurse -Filter "Docker Desktop.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 3 -ExpandProperty FullName | ForEach-Object { Write-Host "Found: $_"; Start-Process $_; $started = $true }
          }

          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 5
            if (Test-DockerReady) {
              Write-Host "Docker ready after attempt $i"
              exit 0
            }
            Write-Host "Waiting for Docker... $i/60"
          }

          Write-Host "HINT: On the self-hosted runner PC, start Docker Desktop manually, then re-run this workflow."
          throw "Docker daemon did not become ready in time"

      - name: Pull and rebuild on this PC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\Program Files\Docker\Docker\resources\bin;C:\Program Files\Git\cmd;" + $env:Path
          $dir = "C:\Network\_work\KYC"
          if (-not (Test-Path $dir)) { throw "Pasta em falta: $dir" }
          Set-Location $dir
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          docker compose up -d --build
          Write-Host "Applying EF migrations (explicit --migrate-only)..."
          docker compose run --rm --no-deps kyc-web --migrate-only
          docker compose ps
          $port = "8083"
          if (Test-Path .env) {
            $m = Select-String -Path .env -Pattern '^KYC_WEB_PORT=(.+)$' | Select-Object -First 1
            if ($m) { $port = $m.Matches.Groups[1].Value.Trim() }
          }
          $ok = $false
          for ($i = 1; $i -le 40; $i++) {
            Start-Sleep -Seconds 3
            try {
              $health = Invoke-WebRequest "http://localhost:$port/health" -UseBasicParsing -TimeoutSec 10
              if ($health.StatusCode -eq 200) {
                Write-Host $health.Content
                $ok = $true
                break
              }
            } catch {
              Write-Host "Health attempt $i/40: $($_.Exception.Message)"
            }
          }
          if (-not $ok) {
            Write-Host "--- docker compose ps ---"
            docker compose ps -a
            Write-Host "--- kyc-web logs (tail) ---"
            cmd /c "docker logs --tail 120 network-kyc-web 2>&1"
            Write-Host "--- kyc-workers logs (tail) ---"
            cmd /c "docker logs --tail 80 network-kyc-workers 2>&1"
            throw "Health check falhou apos espera (porta $port)"
          }
