name: Deploy local

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-local-kyc
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, network-local]
    timeout-minutes: 45
    steps:
      - name: Ensure Docker Desktop is running
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\Program Files\Docker\Docker\resources\bin;C:\Program Files\Git\cmd;" + $env:Path

          $dockerDesktop = "C:\Program Files\Docker\Docker\Docker Desktop.exe"
          function Test-DockerReady {
            try {
              docker info 2>$null | Out-Null
              return $LASTEXITCODE -eq 0
            } catch { return $false }
          }

          if (-not (Test-DockerReady)) {
            Write-Host "Docker daemon not ready - starting Docker Desktop..."
            if (Get-Service -Name "com.docker.service" -ErrorAction SilentlyContinue) {
              Start-Service com.docker.service -ErrorAction SilentlyContinue
            }
            if (Test-Path $dockerDesktop) {
              Start-Process $dockerDesktop
            } else {
              throw "Docker Desktop not found at $dockerDesktop"
            }
            $ready = $false
            for ($i = 1; $i -le 60; $i++) {
              Start-Sleep -Seconds 5
              if (Test-DockerReady) {
                Write-Host "Docker ready after attempt $i"
                $ready = $true
                break
              }
              Write-Host "Waiting for Docker... $i/60"
            }
            if (-not $ready) { throw "Docker Desktop did not become ready in time" }
          } else {
            Write-Host "Docker already running"
          }

      - name: Pull and rebuild on this PC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\Program Files\Docker\Docker\resources\bin;C:\Program Files\Git\cmd;" + $env:Path
          $dir = "C:\Network\_work\KYC"
          if (-not (Test-Path $dir)) { throw "Pasta em falta: $dir" }
          Set-Location $dir
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
          $port = "8083"
          if (Test-Path .env) {
            $m = Select-String -Path .env -Pattern '^KYC_WEB_PORT=(.+)$' | Select-Object -First 1
            if ($m) { $port = $m.Matches.Groups[1].Value.Trim() }
          }
          $ok = $false
          for ($i = 1; $i -le 40; $i++) {
            Start-Sleep -Seconds 3
            try {
              $health = Invoke-WebRequest "http://localhost:$port/health" -UseBasicParsing -TimeoutSec 10
              if ($health.StatusCode -eq 200) {
                Write-Host $health.Content
                $ok = $true
                break
              }
            } catch {
              Write-Host "Health attempt $i/40: $($_.Exception.Message)"
            }
          }
          if (-not $ok) {
            Write-Host "--- docker compose ps ---"
            docker compose ps -a
            Write-Host "--- web logs (tail) ---"
            docker compose logs --tail 80 web 2>$null
            throw "Health check falhou apos espera (porta $port)"
          }
