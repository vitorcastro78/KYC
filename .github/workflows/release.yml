name: KYC Release (Windows appliance)

# Builds the Inno installer + ZIP and attaches them to the GitHub Release
# created by release-please (or an existing tag release).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao semver (ex: 1.0.0, sem prefixo v) — so para dispatch manual"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    if: github.repository == 'vitorcastro78/KYC'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Install EF tools
        run: dotnet tool install dotnet-ef --global

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $v = "${{ github.event.release.tag_name }}" -replace '^v', ''
          } else {
            $v = "${{ inputs.version }}"
          }
          $v = $v.Trim()
          if ([string]::IsNullOrWhiteSpace($v)) { throw "Versao em falta" }
          Write-Host "Versao: $v"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v" -Encoding Ascii

      - name: Build installer
        shell: pwsh
        run: |
          ./tools/appliance/installer/Build-KycInstaller.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kyc-platform-installer
          path: |
            tools/appliance/dist/KycPlatform-*-setup.exe
            tools/appliance/dist/kyc-platform-*.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $tag = "${{ github.event.release.tag_name }}"
          $dist = "tools/appliance/dist"
          gh release upload $tag `
            "$dist/KycPlatform-$ver-setup.exe" `
            "$dist/kyc-platform-$ver.zip" `
            --clobber
